<div class="flex flex-col gap-4">
  <tui-stepper [activeItemIndex]="activeIndex()">
    @for (label of items(); track label) {
      <button tuiStep (click)="handleStep($index)">
        {{ label }}
      </button>
    }
  </tui-stepper>

  @if (steps()[activeIndex()].contentTemplate(); as template) {
    <div>
      <ng-container [ngTemplateOutlet]="template"></ng-container>
    </div>
  }

  <div class="flex justify-between">
    <button size="s" tuiButton>back</button>
    <button
      size="s"
      (click)="handleNext()"
      [disabled]="isNextDisabled()"
      tuiButton
    >
      Next
    </button>
  </div>
</div>
