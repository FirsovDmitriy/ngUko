@let template = steps()[activeIndex()].contentTemplate();

<div class="grid gap-4">
  <tui-stepper [activeItemIndex]="activeIndex()">
    @for (item of steps(); track $index) {
      <button
        tuiStep
        (click)="handleStep($index)"
        [stepState]="item.stepState()"
      >
        <span class="flex flex-col text-sm">
          {{ item.label() }}
        </span>
      </button>
    }
  </tui-stepper>
  <div class="flex justify-between">
    <button
      appearance="icon"
      iconStart="@tui.arrow-left"
      tuiIconButton
      type="button"
      size="s"
    ></button>
    <div class="flex gap-1">
      <button tuiButton size="s" type="button">Сохранить как черновик</button>
      <button type="button" size="s" (click)="goTo()" tuiButton>Далее</button>
    </div>
  </div>
  @if (template) {
    <div class="">
      <ng-container [ngTemplateOutlet]="template"></ng-container>
    </div>
  }
</div>
