<h1 class="mb-2 text-gray-900 text-2xl">Выбор типа сообщения</h1>
<form class="relative grid grid-cols-[1fr_2fr]">
  <div class="" tuiGroup [collapsed]="true">
   <label tuiBlock="m"> <input tuiRadio type="radio"
      
      name="message-type"
      
      [formControl]="messageType"
      value="email"
    >
      Email
    </label>
   <label tuiBlock="m"> <input tuiRadio type="radio"
      
      [formControl]="messageType"
      
      value="mobilePush"
    >
      Mobile push
    </label>
   <label tuiBlock="m"> <input tuiRadio type="radio"
      
      [formControl]="messageType"
      
      value="webPush"
    >
      Web push
    </label>
  </div>
  <uko-error-text
    [control]="messageType"
    errorText="This field is required"
  ></uko-error-text>
</form>
