<h1 class="mb-2 text-gray-900 text-2xl">Выбор типа сообщения</h1>
<form class="relative grid grid-cols-[2fr_2fr]">
  <div class="" tuiGroup [collapsed]="true">
    <label class="flex items-center" tuiBlock="m">
      <input
        tuiRadio
        type="radio"
        name="messageType"
        [formControl]="messageType"
        value="email"
      />
      Email
    </label>
    <label class="flex items-center" tuiBlock="m">
      <input
        tuiRadio
        name="messageType"
        type="radio"
        [formControl]="messageType"
        value="mobilePush"
      />
      Mobile push
    </label>
    <label class="flex items-center" tuiBlock="m">
      <input
        tuiRadio
        name="messageType"
        type="radio"
        [formControl]="messageType"
        value="webPush"
      />
      Web push
    </label>
  </div>
  <uko-error-text
    [control]="messageType"
    errorText="This field is required"
  ></uko-error-text>
</form>
