<div class="min-h-screen bg-gray-100 p-6">
  <div class="max-w-7xl mx-auto">
    <div class="mb-6">
      <h1 class="text-3xl font-bold text-gray-900">Редактор Email сообщения</h1>
      <p class="text-gray-600 mt-2">
        Настройте параметры письма и просмотрите результат
      </p>
    </div>

    <!-- Main Content -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <!-- Preview -->
      <div class="bg-white rounded-lg shadow-lg p-6">
        <h2 class="text-xl font-semibold text-gray-900 mb-4 flex items-center">
          Предпросмотр
        </h2>
        <div
          class="border-2 border-dashed border-gray-300 rounded-lg flex items-center justify-center min-h-[500px] text-gray-400"
        >
          <div class="text-center">
            <p class="text-sm">Здесь будет отображаться предпросмотр письма</p>
          </div>
        </div>
      </div>

      <!-- Form Block -->
      <div class="bg-white rounded-lg shadow-lg p-6">
        <h2 class="text-xl font-semibold text-gray-900 mb-4 flex items-center">
          Настройки
        </h2>

        <form [formGroup]="emailForm" class="space-y-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Тема письма <span class="text-red-500">*</span>
              <uko-textfield
                formControlName="subject"
                placeholder="Введите тему письма"
              ></uko-textfield>
            </label>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              От кого <span class="text-red-500">*</span>
            </label>
            <input
              formGroupName="emailFrom"
              type="email"
              name="emailFrom"
              placeholder="sender@example.com"
              class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Получатели <span class="text-red-500">*</span>
            </label>
            <textarea
              formGroupName="recipients"
              name="recipients"
              rows="3"
              placeholder="recipient1@example.com, recipient2@example.com"
              class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
            ></textarea>
            <p class="mt-1 text-xs text-gray-500">
              Разделяйте адреса запятой или переносом строки
            </p>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Копия (CC)
            </label>
            <textarea
              name="emailCc"
              rows="2"
              placeholder="cc1@example.com, cc2@example.com"
              class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
            ></textarea>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Скрытая копия (BCC)
            </label>
            <textarea
              name="emailBcc"
              rows="2"
              placeholder="bcc1@example.com, bcc2@example.com"
              class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
            ></textarea>
          </div>

          <!-- Email Template (WYSIWYG) -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Шаблон письма <span class="text-red-500">*</span>
            </label>
            <div class="border border-gray-300 rounded-md overflow-hidden">
              <!-- WYSIWYG Editor Area -->
              <div class="min-h-[200px] p-4 text-gray-400 text-sm">
                Введите содержимое письма...
              </div>
            </div>
          </div>
          <div class="border-t border-gray-200 pt-6">
            <div class="flex items-center justify-between mb-4">
              <h3 class="text-lg font-medium text-gray-900">Вложения</h3>
              <button
                type="button"
                class="inline-flex items-center px-3 py-2 border border-transparent text-sm leading-4 font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
              >
                Добавить вложение
              </button>
            </div>
            <div
              class="text-center py-8 text-gray-400 border-2 border-dashed border-gray-300 rounded-lg"
            >
              <p class="text-sm">Нет вложений</p>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
